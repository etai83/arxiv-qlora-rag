model: mlx-community/Llama-3.2-3B-Instruct-4bit
train: true
fine_tune_type: lora
data: data/qlora
seed: 42
num_layers: 28
batch_size: 4
iters: 600
val_batches: 25
learning_rate: 0.0001
steps_per_report: 10
steps_per_eval: 50
save_every: 200
adapter_path: models/llama32_3b_qlora_adapters
max_seq_length: 2048
grad_checkpoint: true
mask_prompt: true
lora_parameters:
  rank: 16
  scale: 2.0
  dropout: 0.05
lr_schedule:
  name: cosine_decay
  warmup: 40
  arguments:
  - 0.0001
  - 600
  - 1.0e-05
